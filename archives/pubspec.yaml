name: archives
description: "A Threads-inspired social media application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # UI / Utilities
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  timeago: ^3.7.0
  uuid: ^4.5.1
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  http: ^1.2.2
  flutter_dotenv: ^6.0.0
  share_plus: ^10.1.4
  emoji_picker_flutter: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6
  fake_cloud_firestore: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - .env

flutter_native_splash:
  color: "#0D1117"
  color_dark: "#0D1117"
  android_12:
    color: "#0D1117"
    color_dark: "#0D1117"
  web: true
